name: JILANI VAULT - APK Android
on:
  push:
    paths: ['jv/jilani-vault-premium-offline/**', '.github/workflows/jilani-vault-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: jv/jilani-vault-premium-offline } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo prebuild --platform android --no-install
      - run: cd android && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jilani-vault-apk
          path: jv/jilani-vault-premium-offline/android/app/build/outputs/apk/release/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: jilani-vault-v2.0.${{ github.run_number }}
          name: JILANI VAULT v2.0 (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: jv/jilani-vault-premium-offline/android/app/build/outputs/apk/release/*.apk
